# ============================================================================
#  S7 PONTO — bloco para servir o app em https://s7strategy.com.br/s7ponto/
#
#  Cole este trecho DENTRO do server { ... } do site s7strategy.com.br,
#  no arquivo de configuração do nginx (normalmente em
#  /etc/nginx/sites-available/s7strategy.com.br).
#
#  Depois:  sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

# sem a barra no final, redireciona (senão o CSS e o JS quebram)
location = /s7ponto {
    return 301 /s7ponto/;
}

location /s7ponto/ {
    alias /var/www/s7ponto/;
    index index.html;
    try_files $uri $uri/ =404;

    # O HTML nunca fica em cache: assim uma atualização aparece na hora.
    location ~* /s7ponto/.*\.html$ {
        alias /var/www/s7ponto/;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # CSS e JS podem ficar cinco minutos em cache.
    location ~* /s7ponto/.*\.(css|js)$ {
        alias /var/www/s7ponto/;
        add_header Cache-Control "public, max-age=300" always;
    }

    # O app é interno — fora dos buscadores.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}
