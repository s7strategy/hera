[project]
name = "mapa-optico-pipeline"
version = "0.1.0"
description = "Pipeline de ingestao e scoring de municipios para eventos de saude ocular"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# CNES via DATASUS. `datasus-dbc` decodifica o .DBC (DBF comprimido com
# algoritmo proprietario; dbfread puro NAO abre) e `dbfread` le o .DBF que sai.
# `pysus` fica como quarto caminho, nao como alicerce: a API dela muda.
#   uv sync --extra cnes
cnes = ["datasus-dbc>=0.1", "dbfread>=2.0", "pysus>=0.12"]
# Carga no Supabase. Sem isso o pipeline ainda roda e exporta CSV/JSON local.
supabase = ["supabase>=2.4"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
mapa-optico = "mapa_optico.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapa_optico"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Fixtures de teste ficam mais legiveis com dict(...) do que com chaves.
"tests/*" = ["C408"]
