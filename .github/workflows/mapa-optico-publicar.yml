# Publica o dashboard no GitHub Pages.
#
# Por que Pages e nao Vercel: o projeto da Vercel deste repositorio (o site de
# apresentacao da HERA) nao esta conectado ao Git — nenhum commit recebe status
# de deploy. Pages sai do proprio Actions, sem conta nova e sem CLI.
name: Mapa Óptico — publicar

on:
  push:
    branches:
      - main
      - claude/app-development-p8hrwg
    paths:
      - "mapa-optico/web/**"
      - ".github/workflows/mapa-optico-publicar.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy de Pages por vez; o mais novo vence.
concurrency:
  group: mapa-optico-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # ref_name e nao github.sha: quando o pipeline de dados chama este
      # workflow, o snapshot novo esta na ponta da branch, nao no commit que
      # disparou a execucao.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mapa-optico/web/package-lock.json

      - name: Instalar dependências
        working-directory: mapa-optico/web
        run: npm ci

      - name: Conferir tipos
        working-directory: mapa-optico/web
        run: npm run typecheck

      - name: Build
        working-directory: mapa-optico/web
        env:
          # Pages serve em /<repo>/, entao os assets precisam desse prefixo.
          APP_BASE: /hera/
        run: npm run build

      # 404.html identico ao index: o app nao tem rotas, mas link errado
      # devolvendo a tela em vez do 404 do GitHub e mais gentil.
      - name: Rede de segurança para URL errada
        working-directory: mapa-optico/web
        run: cp dist/index.html dist/404.html

      # `enablement: true` so funciona se o Pages ja estiver ligado ou se o
      # token puder liga-lo — e o GITHUB_TOKEN nao pode criar o site. Enquanto
      # ninguem virar essa chave, o build continua valido e o job explica o que
      # falta em vez de pintar de vermelho um passo que nao depende do codigo.
      - id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: ${{ steps.pages.outcome == 'success' }}
        with:
          path: mapa-optico/web/dist

      - id: deploy
        if: ${{ steps.pages.outcome == 'success' }}
        uses: actions/deploy-pages@v4

      - name: Resumo
        run: |
          if [ "${{ steps.pages.outcome }}" = "success" ]; then
            echo "App publicado em ${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### O app foi montado, mas não foi publicado"
              echo
              echo "O GitHub Pages ainda não está ligado neste repositório, e o token"
              echo "do Actions não tem permissão para ligá-lo sozinho."
              echo
              echo "Para ligar (uma vez só): **Settings → Pages → Build and deployment"
              echo "→ Source: GitHub Actions**. Depois é só rodar este workflow de novo."
              echo
              echo "Enquanto isso o app está no artefato \`dashboard\`, abaixo:"
              echo "baixe, descompacte e abra \`mapa-optico.html\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Arquivo unico: abre com dois cliques, sem servidor e sem rede. E o que
      # torna esta execucao util mesmo com o Pages desligado.
      - name: Montar versão de arquivo único
        working-directory: mapa-optico/web
        run: npm run build:unico

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: mapa-optico/web/dist/mapa-optico.html
